<!DOCTYPE html>
<html>
<head>
    <title>Novo Usuário</title>
</head>
<body>

<h1>Novo Usuário</h1>

<form method="POST">

    <label>Nome:</label>
    <br>

    <input
        type="text"
        name="nome"
        required
    >

    <br><br>

    <label>Email:</label>
    <br>

    <input
        type="email"
        name="email"
        required
    >

    <br><br>

    <button type="submit">
        Salvar
    </button>

</form>

</body>
</html>
