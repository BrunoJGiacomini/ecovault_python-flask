{% extends 'base.html' %}

{% block content %}

<h1>🏆 Ranking EcoVault</h1>

<table class="table table-striped">

    <thead>
        <tr>
            <th>Posição</th>
            <th>Usuário</th>
            <th>Pontos</th>
        </tr>
    </thead>

    <tbody>

    {% for usuario in usuarios %}

        <tr>

            <td>{{ loop.index }}°</td>

            <td>{{ usuario.nome }}</td>

            <td>{{ usuario.pontos }}</td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
