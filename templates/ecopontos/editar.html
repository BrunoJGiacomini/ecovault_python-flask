{% extends 'base.html' %}

{% block content %}

<h1>Editar Ecoponto</h1>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input
            type="text"
            class="form-control"
            name="nome"
            value="{{ ecoponto.nome }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Cidade</label>
        <input
            type="text"
            class="form-control"
            name="cidade"
            value="{{ ecoponto.cidade }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Endereço</label>
        <input
            type="text"
            class="form-control"
            name="endereco"
            value="{{ ecoponto.endereco }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Tipo de Material</label>
        <input
            type="text"
            class="form-control"
            name="tipo_material"
            value="{{ ecoponto.tipo_material }}"
            required>
    </div>

    <button
        type="submit"
        class="btn btn-success">

        Atualizar

    </button>

    <a
        href="/ecopontos"
        class="btn btn-secondary">

        Voltar

    </a>

</form>

{% endblock %}
